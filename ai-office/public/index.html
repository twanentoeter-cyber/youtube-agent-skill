<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Kantoor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
<style>
:root {
  --bg: #ece6da; --floor-a: #e2dbcc; --floor-b: #dad2c1; --wall: #f6f1e7;
  --ink: #1d1c1a; --muted: #6d675e; --card: #fffdf8; --line: #1a1a1a; --shadow: 0 2px 0 rgba(0,0,0,.08);
  --desk: #b3855a; --desk-top: #cf9f6e; --chair: #3d4350; --laptop: #d4d9df; --mug: #e9e4dc;
  --working: #2e9b67; --waiting: #ea7317; --done: #3874c2; --sleeping: #8b90a2;
  --working-bg: #e3f4ea; --waiting-bg: #fdebdc; --done-bg: #e2ecf8; --sleeping-bg: #eceef3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161b; --floor-a: #1a2028; --floor-b: #171c23; --wall: #1d242d;
    --ink: #eef1f4; --muted: #9aa4af; --card: #232b35; --shadow: 0 2px 0 rgba(0,0,0,.35);
    --desk: #6f5237; --desk-top: #8b6a48; --chair: #2b303a; --laptop: #aeb6bf; --mug: #cfc9bf;
    --working-bg: #183528; --waiting-bg: #3b2615; --done-bg: #182a40; --sleeping-bg: #262b35;
  }
}
:root[data-theme="dark"] {
  --bg: #12161b; --floor-a: #1a2028; --floor-b: #171c23; --wall: #1d242d;
  --ink: #eef1f4; --muted: #9aa4af; --card: #232b35; --shadow: 0 2px 0 rgba(0,0,0,.35);
  --desk: #6f5237; --desk-top: #8b6a48; --chair: #2b303a; --laptop: #aeb6bf; --mug: #cfc9bf;
  --working-bg: #183528; --waiting-bg: #3b2615; --done-bg: #182a40; --sleeping-bg: #262b35;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
}
header {
  position: sticky; top: 0; z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
  padding: 14px 24px; background: var(--wall); border-bottom: 3px solid var(--line);
}
h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }
h1 span { color: var(--muted); font-weight: 500; font-size: 14px; margin-left: 6px; }
.counts { display: flex; gap: 8px; flex-wrap: wrap; }
.count { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-weight: 600; font-size: 13px; border: 2px solid var(--line); background: var(--card); }
.count i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button, .toggle {
  font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--card);
  border: 2px solid var(--line); border-radius: 10px; padding: 5px 11px; cursor: pointer; box-shadow: var(--shadow);
}
button:hover, .toggle:hover { transform: translateY(-1px); }
button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
#banner { display: none; margin: 16px 24px 0; padding: 10px 14px; border: 2px solid var(--waiting); background: var(--waiting-bg); border-radius: 12px; font-weight: 600; }

main {
  padding: 28px 24px 60px;
  background:
    repeating-linear-gradient(90deg, transparent 0 79px, rgba(0,0,0,.035) 79px 80px),
    repeating-linear-gradient(0deg, var(--floor-a) 0 40px, var(--floor-b) 40px 80px);
  min-height: calc(100vh - 64px);
}
.office { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 34px 26px; align-items: end; }

.desk { position: relative; display: flex; flex-direction: column; align-items: center; cursor: pointer; outline: none; }
.desk:focus-visible .label { outline: 3px solid var(--done); }
.desk.helper { transform: scale(.82); transform-origin: bottom center; margin-top: -10px; }

/* het kaartje boven het hoofd */
.label {
  position: relative; width: 100%; max-width: 280px; background: var(--card);
  border: 3px solid var(--line); border-radius: 14px; padding: 9px 12px 10px; box-shadow: 0 4px 0 rgba(0,0,0,.12);
  transition: transform .15s;
}
.desk:hover .label { transform: translateY(-3px); }
.label::after {
  content: ""; position: absolute; left: 50%; bottom: -12px; width: 18px; height: 18px; background: var(--card);
  border-right: 3px solid var(--line); border-bottom: 3px solid var(--line); transform: translateX(-50%) rotate(45deg);
}
.who { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.who b { font-size: 17px; white-space: nowrap; }
.proj { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.status {
  margin-top: 7px; display: flex; gap: 7px; align-items: flex-start; padding: 5px 9px; border-radius: 9px;
  font-size: 13px; font-weight: 600; line-height: 1.3;
}
.status .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; }
.status span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
.s-working .status { background: var(--working-bg); } .s-working .dot { background: var(--working); animation: pulse 1.2s infinite; }
.s-waiting .status { background: var(--waiting-bg); } .s-waiting .dot { background: var(--waiting); animation: pulse .8s infinite; }
.s-done .status { background: var(--done-bg); } .s-done .dot { background: var(--done); }
.s-sleeping .status { background: var(--sleeping-bg); color: var(--muted); } .s-sleeping .dot { background: var(--sleeping); }
.s-waiting .label { border-color: var(--waiting); box-shadow: 0 0 0 4px color-mix(in srgb, var(--waiting) 25%, transparent), 0 4px 0 rgba(0,0,0,.12); }
.s-waiting .label::after { border-color: var(--waiting); }
.helper-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; background: var(--ink); color: var(--card); border-radius: 6px; padding: 1px 6px; }

.scene { width: 100%; max-width: 280px; margin-top: 8px; display: block; overflow: visible; }
.s-sleeping .scene { filter: saturate(.55) brightness(.92); }

/* animaties in de scene */
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
@keyframes typeL { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
@keyframes typeR { 0%,100% { transform: translateY(-4px) } 50% { transform: translateY(0) } }
@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(1.5px) } }
@keyframes wave { 0%,100% { transform: rotate(0) } 50% { transform: rotate(-12deg) } }
@keyframes bounce { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
@keyframes zz { 0% { opacity: 0; transform: translate(0,0) scale(.7) } 30% { opacity: 1 } 100% { opacity: 0; transform: translate(18px,-30px) scale(1.2) } }
@keyframes steam { 0% { opacity: 0; transform: translateY(4px) } 40% { opacity: .7 } 100% { opacity: 0; transform: translateY(-12px) } }
@keyframes glow { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
@keyframes dots { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
.hand-l { animation: typeL .32s infinite; transform-box: fill-box; }
.hand-r { animation: typeR .32s infinite; transform-box: fill-box; }
.head-bob { animation: bob 1.6s ease-in-out infinite; }
.arm-up { transform-origin: 150px 112px; animation: wave 1s ease-in-out infinite; }
.bubble { animation: bounce 1s ease-in-out infinite; transform-box: fill-box; }
.z { animation: zz 2.4s linear infinite; transform-box: fill-box; }
.z2 { animation-delay: .8s } .z3 { animation-delay: 1.6s }
.steam { animation: steam 2s ease-out infinite; transform-box: fill-box; } .steam2 { animation-delay: 1s }
.logo-glow { animation: glow 1.4s ease-in-out infinite; }
.d1 { animation: dots 1s infinite } .d2 { animation: dots 1s .2s infinite } .d3 { animation: dots 1s .4s infinite }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.empty { text-align: center; padding: 80px 20px; color: var(--muted); }
.empty h2 { color: var(--ink); margin: 0 0 8px; }
code { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-size: 13px; }

/* detailpaneel */
aside {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); z-index: 10; overflow-y: auto;
  background: var(--card); border-left: 3px solid var(--line); padding: 22px; transform: translateX(100%); transition: transform .2s;
}
aside.open { transform: translateX(0); box-shadow: -10px 0 30px rgba(0,0,0,.2); }
aside h2 { margin: 0 0 2px; font-size: 22px; }
aside .close { position: absolute; top: 16px; right: 16px; }
aside dl { margin: 16px 0 0; display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px 10px; font-size: 14px; }
aside dt { color: var(--muted); }
aside dd { margin: 0; word-break: break-word; }
aside .msg { white-space: pre-wrap; background: var(--bg); border-radius: 10px; padding: 10px; font-size: 13px; max-height: 260px; overflow: auto; }
.rename { display: flex; gap: 8px; margin-top: 14px; }
.rename input { flex: 1; font: inherit; padding: 6px 10px; border: 2px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
.cmd { display: flex; gap: 8px; align-items: center; }
.cmd code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@media (max-width: 600px) {
  header { padding: 12px 16px; } main { padding: 22px 16px 50px; }
  .tools { margin-left: 0; }
  .office { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
}
</style>
</head>
<body>
<header>
  <h1>🏢 AI Kantoor <span id="sub">laden…</span></h1>
  <div class="counts" id="counts"></div>
  <div class="tools">
    <button id="btnSleep" aria-pressed="true" title="Slapende medewerkers tonen of verbergen">💤 Slapers</button>
    <button id="btnNotify" aria-pressed="false" title="Melding als iemand op je wacht">🔔 Meldingen</button>
    <button id="btnTheme" title="Licht/donker">🌓</button>
    <span class="clock" id="clock"></span>
  </div>
</header>
<div id="banner"></div>
<main><div class="office" id="office"></div><div class="empty" id="empty" hidden></div></main>
<aside id="panel" aria-hidden="true"></aside>

<script>
const LABELS = { working: 'Aan het werk', waiting: 'Wacht op mij', done: 'Klaar', sleeping: 'Slaapt' };
const ORDER = ['waiting', 'working', 'done', 'sleeping'];
const SHIRTS = ['#3f7cc6', '#d1495b', '#2e9b67', '#8a5cc2', '#e0a030', '#2a9d8f', '#c7603a', '#5b6bbf', '#9b4d7a', '#6b8e23'];
const SKINS = ['#f2c7a5', '#e3a77c', '#c98c5e', '#a96f45', '#7d4f31', '#f5d6bd'];
const HAIRS = ['#2b1d14', '#4a2e1f', '#7a4a26', '#c9a15a', '#1c1c1c', '#8c3b1f', '#6b6b6b'];

let state = { agents: [] }, prevStatus = new Map(), showSleep = true, notify = false, selected = null;
try { showSleep = localStorage.getItem('office.sleep') !== '0'; notify = localStorage.getItem('office.notify') === '1'; } catch {}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function hash(s) { let h = 0; for (const c of s) h = (h * 33 + c.charCodeAt(0)) >>> 0; return h; }
function ago(ms) {
  if (!ms) return 'onbekend';
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 60) return 'zojuist';
  if (s < 3600) return Math.round(s / 60) + ' min geleden';
  if (s < 86400) return Math.round(s / 3600) + ' uur geleden';
  return Math.round(s / 86400) + ' dagen geleden';
}
function statusText(a) {
  if (a.status === 'working') return LABELS.working + (a.activity ? ' met: ' + a.activity : '');
  if (a.status === 'waiting') return LABELS.waiting + (a.reason ? ' · ' + a.reason : '');
  if (a.status === 'done') return LABELS.done + (a.activity ? ' · ' + a.activity : '');
  return LABELS.sleeping + (a.reason ? ' · ' + a.reason : '');
}

/* ---------- het tekenen van een bureau met medewerker ---------- */
function scene(a) {
  const h = hash(a.id);
  const shirt = SHIRTS[h % SHIRTS.length], skin = SKINS[(h >> 4) % SKINS.length], hair = HAIRS[(h >> 8) % HAIRS.length];
  const style = (h >> 12) % 3, st = a.status;
  const S = 'stroke="var(--line)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"';
  const hairPath = [
    `<path d="M95,72 Q93,44 120,43 Q147,44 145,72 Q138,58 120,58 Q102,58 95,72 Z" fill="${hair}" ${S}/>`,
    `<path d="M94,96 L94,68 Q94,42 120,42 Q146,42 146,68 L146,96 L138,96 L138,66 Q128,58 120,58 Q108,58 102,66 L102,96 Z" fill="${hair}" ${S}/>`,
    `<g fill="${hair}" ${S}><circle cx="102" cy="56" r="11"/><circle cx="120" cy="47" r="12"/><circle cx="138" cy="56" r="11"/></g>`,
  ][style];

  const eyes = {
    working: `<circle cx="111" cy="76" r="3" fill="var(--line)"/><circle cx="129" cy="76" r="3" fill="var(--line)"/>`,
    waiting: `<circle cx="111" cy="73" r="3.6" fill="var(--line)"/><circle cx="129" cy="73" r="3.6" fill="var(--line)"/>`,
    done: `<path d="M106,74 Q111,69 116,74 M124,74 Q129,69 134,74" fill="none" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>`,
  }[st] || '';
  const mouth = {
    working: `<path d="M115,87 L125,87" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>`,
    waiting: `<ellipse cx="120" cy="87" rx="3.5" ry="4.5" fill="var(--line)"/>`,
    done: `<path d="M112,85 Q120,93 128,85" fill="none" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>`,
  }[st] || '';

  const desk = `
    <rect x="18" y="140" width="204" height="13" rx="3" fill="var(--desk-top)" ${S}/>
    <rect x="30" y="153" width="180" height="36" fill="var(--desk)" ${S}/>
    <rect x="92" y="163" width="56" height="16" rx="3" fill="var(--card)" stroke="var(--line)" stroke-width="2.5"/>
    <text x="120" y="175" text-anchor="middle" font-size="10" font-weight="800" fill="var(--ink)" font-family="system-ui,sans-serif">${esc(a.name.toUpperCase().slice(0, 10))}</text>`;
  const lampOn = st !== 'sleeping';
  const lamp = `
    ${lampOn ? `<path d="M40,104 L22,140 L70,140 Z" fill="#ffe9a8" opacity=".35"/>` : ''}
    <path d="M36,138 L36,112 L50,100" fill="none" ${S}/>
    <path d="M44,96 L60,92 L58,108 Z" fill="${lampOn ? '#f2c94c' : '#8f8a7e'}" ${S}/>
    <rect x="26" y="134" width="22" height="6" rx="2" fill="var(--chair)" ${S}/>`;
  const steam = st === 'done' ? `<path class="steam" d="M191,116 q-4,-6 0,-12" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round"/><path class="steam steam2" d="M199,116 q-4,-6 0,-12" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round"/>` : '';
  const mug = `${steam}<rect x="184" y="120" width="20" height="20" rx="3" fill="var(--mug)" ${S}/><path d="M204,125 q8,0 8,6 q0,6 -8,6" fill="none" ${S}/>`;
  const chair = `<rect x="82" y="66" width="76" height="72" rx="16" fill="var(--chair)" ${S}/>`;

  let body = '', front = '', badge = '';
  if (st === 'sleeping') {
    body = `
      <path d="M86,140 Q86,112 120,110 Q154,112 154,140 Z" fill="${shirt}" ${S}/>
      <g transform="translate(0,40)">
        <circle cx="120" cy="76" r="24" fill="${skin}" ${S}/>${hairPath}
        <path d="M106,80 Q111,84 116,80 M124,80 Q129,84 134,80" fill="none" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>
      </g>`;
    front = `<rect x="84" y="126" width="72" height="16" rx="8" fill="${shirt}" ${S}/>
      <rect x="150" y="134" width="44" height="6" rx="2" fill="var(--laptop)" ${S}/>`;
    badge = `<g font-family="system-ui,sans-serif" font-weight="800" fill="var(--sleeping)">
      <text class="z" x="150" y="92" font-size="16">Z</text><text class="z z2" x="156" y="84" font-size="13">z</text><text class="z z3" x="162" y="76" font-size="11">z</text></g>`;
  } else {
    const head = `<g class="${st === 'working' ? 'head-bob' : ''}">
        <rect x="112" y="92" width="16" height="16" fill="${skin}" ${S}/>
        <circle cx="120" cy="74" r="24" fill="${skin}" ${S}/>${hairPath}${eyes}${mouth}</g>`;
    body = `<path d="M84,142 Q84,106 120,103 Q156,106 156,142 Z" fill="${shirt}" ${S}/>${head}`;
    const laptop = `<path d="M90,140 L97,106 L143,106 L150,140 Z" fill="var(--laptop)" ${S}/>
      <circle cx="120" cy="123" r="6" fill="${st === 'working' ? '#9ff0c6' : '#ffffff'}" class="${st === 'working' ? 'logo-glow' : ''}"/>`;
    if (st === 'waiting') {
      front = `${laptop}<circle cx="94" cy="138" r="7" fill="${skin}" ${S}/>
        <g class="arm-up"><path d="M150,112 L172,70" stroke="var(--line)" stroke-width="16" stroke-linecap="round"/><path d="M150,112 L172,70" stroke="${shirt}" stroke-width="9" stroke-linecap="round"/>
        <circle cx="174" cy="64" r="8" fill="${skin}" ${S}/></g>`;
      badge = `<g class="bubble"><circle cx="196" cy="42" r="16" fill="var(--waiting)" ${S}/><text x="196" y="50" text-anchor="middle" font-size="22" font-weight="900" fill="#fff" font-family="system-ui,sans-serif">!</text></g>`;
    } else if (st === 'working') {
      front = `${laptop}<circle class="hand-l" cx="94" cy="138" r="7" fill="${skin}" ${S}/><circle class="hand-r" cx="146" cy="138" r="7" fill="${skin}" ${S}/>`;
      badge = `<g class="bubble"><rect x="160" y="30" width="46" height="26" rx="13" fill="var(--card)" ${S}/>
        <circle class="d1" cx="173" cy="43" r="3.5" fill="var(--working)"/><circle class="d2" cx="183" cy="43" r="3.5" fill="var(--working)"/><circle class="d3" cx="193" cy="43" r="3.5" fill="var(--working)"/></g>`;
    } else { // done
      front = `${laptop}<circle cx="94" cy="138" r="7" fill="${skin}" ${S}/><circle cx="146" cy="138" r="7" fill="${skin}" ${S}/>`;
      badge = `<g><circle cx="190" cy="44" r="15" fill="var(--done)" ${S}/><path d="M183,44 L188,50 L198,38" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>`;
    }
  }
  return `<svg class="scene" viewBox="0 0 240 196" role="img" aria-label="${esc(a.name)}: ${esc(LABELS[st])}">
    <ellipse cx="120" cy="190" rx="100" ry="6" fill="rgba(0,0,0,.12)"/>
    ${chair}${body}${lamp}${desk}${mug}${front}${badge}</svg>`;
}

function labelHTML(a) {
  return `<div class="who"><b>${esc(a.name)}</b>${a.kind === 'helper' ? '<span class="helper-tag">helper</span>' : ''}<span class="proj">${esc(a.kind === 'helper' ? 'van ' + a.parentName : a.project)}</span></div>
    <div class="chat" title="${esc(a.title)}">${esc(a.title)}</div>
    <div class="status"><i class="dot"></i><span>${esc(statusText(a))}</span></div>`;
}

/* ---------- renderen zonder animaties te resetten ---------- */
const nodes = new Map();
function render() {
  const agents = state.agents.filter((a) => showSleep || a.status !== 'sleeping');
  const office = $('office');
  const keep = new Set();
  agents.forEach((a, i) => {
    keep.add(a.id);
    let n = nodes.get(a.id);
    if (!n) {
      n = document.createElement('div');
      n.tabIndex = 0; n.setAttribute('role', 'button');
      n.innerHTML = '<div class="label"></div><div class="art"></div>';
      n.addEventListener('click', () => openPanel(a.id));
      n.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPanel(a.id); } });
      nodes.set(a.id, n);
    }
    n.className = `desk s-${a.status}${a.kind === 'helper' ? ' helper' : ''}`;
    const lbl = labelHTML(a);
    if (n._lbl !== lbl) { n.querySelector('.label').innerHTML = lbl; n._lbl = lbl; }
    const artKey = a.status + '|' + a.name;
    if (n._art !== artKey) { n.querySelector('.art').innerHTML = scene(a); n._art = artKey; }
    if (office.children[i] !== n) office.insertBefore(n, office.children[i] || null);
  });
  for (const [id, n] of nodes) if (!keep.has(id)) { n.remove(); nodes.delete(id); }

  const c = { working: 0, waiting: 0, done: 0, sleeping: 0 };
  state.agents.forEach((a) => c[a.status]++);
  $('counts').innerHTML = ORDER.map((s) => `<span class="count"><i style="background:var(--${s})"></i>${c[s]} ${LABELS[s].toLowerCase()}</span>`).join('');
  const live = state.agents.filter((a) => a.live).length;
  $('sub').textContent = `${live} aanwezig · ${state.agents.length} medewerkers`;
  document.title = (c.waiting ? `(${c.waiting}) wacht op jou · ` : '') + 'AI Kantoor';

  const empty = $('empty');
  empty.hidden = agents.length > 0;
  if (!agents.length) empty.innerHTML = state.agents.length
    ? `<h2>Iedereen slaapt 💤</h2><p>Zet “Slapers” aan om ze te zien.</p>`
    : `<h2>Het kantoor is nog leeg</h2><p>Start een Claude Code-sessie en die verschijnt hier vanzelf.<br>Of probeer de demo: <code>node server.js --demo</code></p>`;
  if (selected) renderPanel();
}

/* ---------- detailpaneel ---------- */
function openPanel(id) { selected = id; $('panel').classList.add('open'); $('panel').setAttribute('aria-hidden', 'false'); renderPanel(); }
function closePanel() { selected = null; $('panel').classList.remove('open'); $('panel').setAttribute('aria-hidden', 'true'); }
function renderPanel() {
  const a = state.agents.find((x) => x.id === selected);
  const p = $('panel');
  if (!a) { closePanel(); return; }
  if (p._key === JSON.stringify(a) && p.contains(document.activeElement)) return;
  p._key = JSON.stringify(a);
  p.innerHTML = `<button class="close" id="pClose" aria-label="Sluiten">✕</button>
    <h2>${esc(a.name)}</h2><div class="chat">${esc(a.title)}</div>
    <div class="s-${a.status}"><div class="status"><i class="dot"></i><span>${esc(statusText(a))}</span></div></div>
    <dl>
      <dt>Project</dt><dd>${esc(a.project || '–')}${a.branch ? ' · ' + esc(a.branch) : ''}</dd>
      ${a.cwd ? `<dt>Map</dt><dd>${esc(a.cwd)}</dd>` : ''}
      <dt>Laatst actief</dt><dd>${esc(ago(a.lastActivity))}</dd>
      <dt>Aanwezig</dt><dd>${a.live ? 'ja, chat is open' : 'nee, chat is gesloten'}</dd>
      ${a.lastPrompt ? `<dt>Jouw opdracht</dt><dd><div class="msg">${esc(a.lastPrompt)}</div></dd>` : ''}
      ${a.lastText ? `<dt>Laatste bericht</dt><dd><div class="msg">${esc(a.lastText)}</div></dd>` : ''}
      ${a.resume ? `<dt>Hervatten</dt><dd class="cmd"><code>${esc(a.resume)}</code><button id="pCopy">Kopieer</button></dd>` : ''}
    </dl>
    ${a.kind !== 'helper' ? `<div class="rename"><input id="pName" maxlength="24" placeholder="Andere naam…" value="${esc(a.name)}"><button id="pSave">Hernoem</button></div>` : ''}`;
  $('pClose').onclick = closePanel;
  if ($('pCopy')) $('pCopy').onclick = () => navigator.clipboard?.writeText(a.resume).then(() => { $('pCopy').textContent = 'Gekopieerd'; });
  if ($('pSave')) $('pSave').onclick = async () => {
    await fetch('/api/rename', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: a.id, name: $('pName').value }) });
    p._key = null; poll();
  };
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanel(); });

/* ---------- meldingen ---------- */
function checkTransitions() {
  for (const a of state.agents) {
    const before = prevStatus.get(a.id);
    if (notify && before && before !== 'waiting' && a.status === 'waiting' && 'Notification' in window && Notification.permission === 'granted') {
      new Notification(`${a.name} wacht op je`, { body: `${a.title}\n${a.reason || ''}`, tag: a.id });
    }
    prevStatus.set(a.id, a.status);
  }
}

/* ---------- data ophalen ---------- */
async function poll() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    state = await r.json();
    $('banner').style.display = 'none';
    checkTransitions();
    render();
  } catch {
    $('banner').style.display = 'block';
    $('banner').textContent = 'De kantoorserver is niet bereikbaar. Draait “node server.js” nog?';
  }
}

/* ---------- knoppen ---------- */
function syncButtons() { $('btnSleep').setAttribute('aria-pressed', showSleep); $('btnNotify').setAttribute('aria-pressed', notify); }
$('btnSleep').onclick = () => { showSleep = !showSleep; try { localStorage.setItem('office.sleep', showSleep ? '1' : '0'); } catch {} syncButtons(); render(); };
$('btnNotify').onclick = async () => {
  if (!notify && 'Notification' in window && Notification.permission !== 'granted') {
    if (await Notification.requestPermission() !== 'granted') return;
  }
  notify = !notify; try { localStorage.setItem('office.notify', notify ? '1' : '0'); } catch {} syncButtons();
};
$('btnTheme').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('office.theme', root.dataset.theme); } catch {}
  nodes.forEach((n) => { n._art = null; }); render();
};
try { const t = localStorage.getItem('office.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
syncButtons();
setInterval(() => { $('clock').textContent = new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }); }, 1000);
poll(); setInterval(poll, 2000);
</script>
</body>
</html>
